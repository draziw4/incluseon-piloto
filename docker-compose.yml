services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incluseon
      POSTGRES_USER: incluseon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incluseon -d incluseon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://incluseon:${POSTGRES_PASSWORD:-change-me}@postgres:5432/incluseon
      REDIS_URL: redis://redis:6379/0
      REPORTS_DIRECTORY: /data/reports
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://incluseon:${POSTGRES_PASSWORD:-change-me}@postgres:5432/incluseon
      REDIS_URL: redis://redis:6379/0
      REPORTS_DIRECTORY: /data/reports
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    volumes:
      - reports_data:/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://incluseon:${POSTGRES_PASSWORD:-change-me}@postgres:5432/incluseon
      REDIS_URL: redis://redis:6379/0
      REPORTS_DIRECTORY: /data/reports
    command: celery -A workers.celery_app.celery worker --loglevel=INFO
    volumes:
      - reports_data:/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  reports_data:
