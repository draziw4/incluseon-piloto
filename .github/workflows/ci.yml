name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://incluseon:test-password@localhost:5432/incluseon_test
      SECRET_KEY: test-secret-key-that-is-not-used-in-production
      OPENAI_API_KEY: test-key
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incluseon_test
          POSTGRES_USER: incluseon
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incluseon -d incluseon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../requirements.txt pip-audit
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - run: pip-audit -r ../requirements.txt

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet
      - run: docker build -f backend/Dockerfile -t incluseon-backend:test .
      - run: docker build -f frontend/Dockerfile -t incluseon-frontend:test .
      - run: docker build -f frontend/Dockerfile.render -t incluseon-render-frontend:test .
      - run: docker build -f infra/render/minio/Dockerfile -t incluseon-render-minio:test .

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
