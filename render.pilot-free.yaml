services:
  - type: web
    name: incluseon-piloto-validacao
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./infra/render/pilot/Dockerfile
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: pilot
      - key: DATABASE_URL
        fromDatabase:
          name: incluseon-piloto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: incluseon-piloto-cache
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        value: pilot-demo-no-external-ai
      - key: PILOT_DEMO_MODE
        value: "true"
      - key: PILOT_ADMIN_EMAIL
        sync: false
      - key: PILOT_ADMIN_PASSWORD
        sync: false
      - key: PILOT_PROFESSIONAL_NAME
        sync: false
      - key: PILOT_PROFESSIONAL_EMAIL
        sync: false
      - key: PILOT_PROFESSIONAL_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: REPORTS_DIRECTORY
        value: /tmp/generated_reports
      - key: CORS_ORIGINS
        value: https://incluseon-piloto-validacao.onrender.com
      - key: ALLOWED_HOSTS
        value: incluseon-piloto-validacao.onrender.com
      - key: FRONTEND_URL
        value: https://incluseon-piloto-validacao.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: DEBUG
        value: "false"

  - type: keyvalue
    name: incluseon-piloto-cache
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: incluseon-piloto-db
    plan: free
    region: virginia
    databaseName: incluseon
    user: incluseon
    postgresMajorVersion: "16"
    ipAllowList: []
